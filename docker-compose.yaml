services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
      - logs:/var/log/nginx
    restart: unless-stopped

  logger:
    image: alpine:latest
    depends_on:
      - nginx
    environment:
      DB_PATH: /data/visits.db
    volumes:
      - logs:/var/log/nginx:ro
      - ./logger:/logger:ro
      - ./data:/data
    command: ["sh", "-c", "apk add --no-cache sqlite >/dev/null && sh /logger/watch.sh"]
    restart: unless-stopped

volumes:
  logs:
