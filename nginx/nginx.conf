events {}

http {
  log_format imagelog '$time_iso8601\twallet=$arg_wallet\tip=$remote_addr\txff=$http_x_forwarded_for\tpath=$uri\tstatus=$status';
  access_log /var/log/nginx/access.log imagelog;
  error_log  /var/log/nginx/error.log;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location ~* \.(png|jpe?g|gif|webp|svg)$ {
      try_files $uri =404;
    }

    location / {
      autoindex on;
    }
  }
}
